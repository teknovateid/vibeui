name: Split Package and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to split and release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  split:
    name: Split packages/vibe to teknovateid/vibe-ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Subtree Split packages/vibe
        uses: danharrin/monorepo-split-github-action@v2.3.0
        with:
          package_directory: 'packages/vibe'
          repository_organization: 'teknovateid'
          repository_name: 'vibe-ui'
          branch: 'main'
          tag: ${{ github.ref_name || inputs.tag }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          access_token: ${{ secrets.SPLIT_ACCESS_TOKEN }}

      - name: Create GitHub Release on Monorepo
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: Release ${{ github.ref_name || inputs.tag }}
          generate_release_notes: true
